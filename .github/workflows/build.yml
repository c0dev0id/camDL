name: Build

on:
  push:
    branches:
      - main
      - claude/action-cam-android-download-jt1i8w

# The only way to test this app is to download the APK and sideload it, so a superseded
# run is never worth finishing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # packages defaults to "tools platform-tools", and the obsolete "tools" package no
      # longer exists in the SDK repository, so the default fails outright on current runner
      # images. Only platform-tools is needed here; AGP fetches the platform itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew lint

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # packages defaults to "tools platform-tools", and the obsolete "tools" package no
      # longer exists in the SDK repository, so the default fails outright on current runner
      # images. Only platform-tools is needed here; AGP fetches the platform itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # `test` and not `testDebugUnitTest`: most of the suite lives in :protocol, which is a
      # plain JVM module and so has no Android build variants.
      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # packages defaults to "tools platform-tools", and the obsolete "tools" package no
      # longer exists in the SDK repository, so the default fails outright on current runner
      # images. Only platform-tools is needed here; AGP fetches the platform itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ./gradlew assembleRelease \
            -PappVersionName="dev-${SHORT_SHA}" \
            -PappVersionCode="${GITHUB_RUN_NUMBER}"

      # Without the SIGNING_* secrets the release APK is built unsigned and cannot be
      # installed, which is otherwise a silently green build and a useless artifact.
      - name: Verify APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          if ! "$BUILD_TOOLS/apksigner" verify "$APK"; then
            echo "::error::APK is not signed. Set SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD as repository secrets."
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: app-release

      - name: Rename APK
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          mv app-release.apk "camDL-dev-${SHORT_SHA}.apk"
          echo "apk_name=camDL-dev-${SHORT_SHA}.apk" >> "$GITHUB_ENV"

      - name: Delete existing dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete dev --yes 2>/dev/null || true

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development Build
          body: |
            Automated development build from commit ${{ github.sha }} on ${{ github.ref_name }}.

            This is a pre-release snapshot — not intended for production use.
          draft: false
          prerelease: true
          make_latest: false
          files: ${{ env.apk_name }}
